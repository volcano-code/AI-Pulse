# PostgreSQL + pgvector release-candidate override. CI must still prove migration/concurrency.
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse
volumes:
  postgres_data:
