name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Retrieval regression gate
        run: python -m pytest -q tests/test_retrieval_eval.py
      - name: SQLite migration smoke
        env:
          DATABASE_URL: sqlite:///./data/ci-migration.db
          DATA_MODE: replay
          LLM_MODE: extractive
        run: |
          rm -f data/ci-migration.db
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pulse:pulse-ci-password@127.0.0.1:5432/pulse
      DATA_MODE: replay
      LLM_MODE: extractive
      AUTO_INIT_DB: "false"
      AI_PULSE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r requirements-postgres.txt -r requirements-dev.txt
      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head
      - name: Verify pgvector integration
        run: python -m pytest -q tests/test_postgres_integration.py
      - name: Migration round trip
        run: |
          alembic downgrade -1
          alembic upgrade head
          python -m pytest -q tests/test_postgres_integration.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require lockfile
        run: test -f package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
