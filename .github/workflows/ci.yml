name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest -q
      - name: Retrieval regression gate
        run: python -m pytest -q tests/test_retrieval_eval.py
      - name: SQLite migration smoke
        env:
          DATABASE_URL: sqlite:///./data/ci-migration.db
          DATA_MODE: replay
          LLM_MODE: extractive
        run: |
          rm -f data/ci-migration.db
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  postgres:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://pulse:pulse-ci-password@127.0.0.1:5432/pulse
      DATA_MODE: replay
      LLM_MODE: extractive
      AUTO_INIT_DB: "false"
      AI_PULSE_TEST_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-postgres.txt
      - name: Install PostgreSQL test dependencies
        run: python -m pip install -r requirements-postgres.txt -r requirements-dev.txt
      - name: Upgrade PostgreSQL schema
        run: alembic upgrade head
      - name: Verify pgvector integration
        run: python -m pytest -q tests/test_postgres_integration.py tests/test_provider_calls_postgres.py tests/test_runtime_models_postgres.py
      - name: Migration round trip
        run: |
          alembic downgrade -1
          alembic upgrade head
          python -m pytest -q tests/test_postgres_integration.py tests/test_provider_calls_postgres.py tests/test_runtime_models_postgres.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Require lockfile
        run: test -f package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_DB: ai_pulse_e2e
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse-e2e-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d ai_pulse_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Dedicated ephemeral service; the harness refuses any other DB or host.
      AI_PULSE_E2E_DATABASE_URL: postgresql+psycopg://pulse:pulse-e2e-only@127.0.0.1:5432/ai_pulse_e2e
      NEXT_TELEMETRY_DISABLED: "1"
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-postgres.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend runtime and PostgreSQL driver
        run: python -m pip install -r backend/requirements-postgres.txt
      - name: Install frontend and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build production frontend
        working-directory: apps/web
        run: npm run build
      - name: Native Chromium against migrated PostgreSQL, API and SQL worker
        working-directory: apps/web
        run: npm run test:e2e
      - name: Preserve browser results and failure traces (replay data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-${{ github.sha }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
